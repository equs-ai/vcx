[package]
name = "equs-vcx-did-peer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "did:peer method implementation"
repository = "https://github.com/equs-ai/vcx"
exclude = ["examples/", "tests/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "did_peer"

[dependencies]
did_parser_nom = { package = "equs-vcx-did-parser-nom", version = "0.1.0", path = "../../did_parser_nom" }
did_doc = { package = "equs-vcx-did-doc", version = "0.1.0", path = "../../did_doc" }
did_resolver = { package = "equs-vcx-did-resolver", version = "0.1.0", path = "../../did_resolver" }
public_key = { package = "equs-vcx-public-key", version = "0.1.0", path = "../../public_key" }
thiserror = "1.0.40"
regex = "1.8.4"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.96"
async-trait = "0.1.68"
base64 = "0.22.1"
bs58 = "0.5.0"
multibase = "0.9.1"
unsigned-varint = "0.8.0"
once_cell = "1.18.0"
sha2 = "0.10.8"
log = "0.4.16"
url = { version = "2.3.1", features = ["serde"] }
display_as_json = { package = "equs-vcx-display-as-json", version = "0.1.0", path = "../../../misc/display_as_json" }
typed-builder = "0.19.1"

[dev-dependencies]
tokio = { version = "1.38.0", default-features = false, features = ["macros", "rt"] }
pretty_assertions = "1.4.0"
env_logger = "0.11.3"
log = "0.4"
