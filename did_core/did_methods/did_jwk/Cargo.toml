[package]
name = "did_jwk"
version = "0.1.0"
edition.workspace = true

[dependencies]
did_parser_nom = { package = "equs-vcx-did-parser-nom", version = "0.1.0", path = "../../did_parser_nom" }
did_doc = { package = "equs-vcx-did-doc", version = "0.1.0", path = "../../did_doc" }
did_resolver = { package = "equs-vcx-did-resolver", version = "0.1.0", path = "../../did_resolver" }
public_key = { package = "equs-vcx-public-key", version = "0.1.0", path = "../../public_key", features = ["jwk"] }
async-trait = "0.1.68"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.96"
base64 = "0.22.1"
thiserror = "1.0.44"

[dev-dependencies]
tokio = { version = "1.38.0", default-features = false, features = ["macros", "rt"] }
