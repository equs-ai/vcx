[package]
name = "equs-did-doc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DID Document types and builders"
repository = "https://github.com/equs-ai/vcx"

[lib]
name = "did_doc"

[features]
jwk = ["public_key/jwk"]

[dependencies]
base64 = "0.22.1"
bs58 = "0.5.0"
did_parser_nom = { package = "equs-did-parser-nom", version = "0.1.0", path = "../did_parser_nom" }
public_key = { package = "equs-public-key", version = "0.1.0", path = "../public_key" }
hex = "0.4.3"
multibase = "0.9.1"
pem = "3.0.4"
serde = { version = "1.0.159", default-features = false, features = ["derive"] }
serde_json = "1.0.95"
uniresid = { version = "0.1.4", default-features = false, features = ["serde"] }
url = { version = "2.3.1", features = ["serde"] }
display_as_json = { package = "equs-display-as-json", version = "0.1.0", path = "../../misc/display_as_json" }
did_key = { package = "equs-did-key", version = "0.1.0", path = "../did_methods/did_key" }
thiserror = "1.0.40"
typed-builder = "0.19.1"
log = "0.4"

[dev-dependencies]
pretty_assertions = "1.4.0"
env_logger = "0.11.3"
