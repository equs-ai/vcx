[package]
name = "equs-vcx-display-as-json"
version = "0.1.0"
edition = "2018"
description = "A custom derive macro to implement Display trait as JSON serialization"
repository = "https://github.com/equs-ai/vcx"
license = "MIT"

[lib]
name = "display_as_json"
proc-macro = true

[dependencies]
syn = "2.0.72"
quote = "1.0"

[dev-dependencies]
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
